name: Ops - grant admin (one-time)

# One-time owner-approved maintenance (2026-11-18): add the owner's admin test account to public.admins. Delete after use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - name: Grant admin to 919000000901
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          q() { curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$1"; echo; }
          echo "user exists:"; q '{"query":"select count(*) as users from auth.users where phone = '\''919000000901'\''"}'
          q '{"query":"insert into public.admins (user_id) select id from auth.users where phone = '\''919000000901'\'' on conflict (user_id) do nothing"}'
          echo "is admin:"; q '{"query":"select count(*) as admins from public.admins a join auth.users u on u.id = a.user_id where u.phone = '\''919000000901'\''"}'