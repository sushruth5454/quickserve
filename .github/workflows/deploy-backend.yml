name: Deploy backend (Supabase)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/functions/**']

concurrency: deploy-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      RAZORPAYX_ACCOUNT_NUMBER: ${{ secrets.RAZORPAYX_ACCOUNT_NUMBER }}
      RAZORPAYX_WEBHOOK_SECRET: ${{ secrets.RAZORPAYX_WEBHOOK_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_PUSH_ACCESS_TOKEN }}
    steps:
      - name: Check required secrets
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN PROJECT_REF; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4

      # AI assistant: policy/guardrail/config unit tests + type check gate every backend deploy.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test and type-check ai-assistant
        run: |
          deno test supabase/functions/ai-assistant
          deno check supabase/functions/ai-assistant/index.ts

      - name: Test and type-check send-notifications
        run: |
          deno test supabase/functions/send-notifications
          deno check supabase/functions/send-notifications/index.ts

      # Payout rails (Route + RazorpayX), webhook mapping and payout form validation; mocked gateway.
      - name: Test and type-check payout rails
        run: |
          deno test supabase/functions/provider-payout-account
          deno check supabase/functions/provider-payout-account/index.ts supabase/functions/release-payouts/index.ts supabase/functions/razorpay-webhook/index.ts

      - name: Test and type-check provider service editor API
        run: |
          deno test supabase/functions/provider-service
          deno check supabase/functions/provider-service/index.ts

      - name: Test and type-check review insights
        run: |
          deno test supabase/functions/review-insights
          deno check supabase/functions/review-insights/index.ts

      # SQL: parses the migrations and runs the state machine, chat read-state RLS and notifications outbox on PGlite.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: SQL tests (PGlite)
        working-directory: supabase/tests
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund --registry https://registry.npmjs.org/
          npm test

      - uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" calls the GitHub releases API, which hits shared-runner rate limits.
          version: 3.1.0

      - name: Apply migration 0018 through the Management API
        env:
          MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MANAGEMENT_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          project_ref = os.environ["MANAGEMENT_PROJECT_REF"]
          token = os.environ["MANAGEMENT_TOKEN"]
          url = f"https://api.supabase.com/v1/projects/{project_ref}/database/query"

          def query(sql):
              request = urllib.request.Request(
                  url,
                  data=json.dumps({"query": sql}).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "quickserve-backend-ci",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      return json.loads(response.read().decode() or "[]")
              except urllib.error.HTTPError as error:
                  detail = error.read().decode()
                  raise SystemExit(f"Supabase Management API query failed ({error.code}): {detail}")

          check = query(
              "select exists(select 1 from supabase_migrations.schema_migrations "
              "where version = '0018') as applied"
          )
          if check and check[0].get("applied"):
              print("0018 already recorded in supabase_migrations.schema_migrations; skipped.")
              raise SystemExit(0)

          sql = pathlib.Path("supabase/migrations/0018_archetype_core.sql").read_text()
          query("begin;\n" + sql + "\nrollback;")
          print("0018 dry run succeeded.")
          query(
              "begin;\n"
              + sql
              + "\ninsert into supabase_migrations.schema_migrations(version) values ('0018') "
                "on conflict (version) do nothing;\n"
                "commit;"
          )
          print("0018 applied and migration version recorded.")
          PY

      - name: Apply database migrations (only when SUPABASE_DB_PASSWORD is set)
        if: env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Apply migration 0019 through the Management API
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        env:
          MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MANAGEMENT_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          url = f"https://api.supabase.com/v1/projects/{os.environ['MANAGEMENT_PROJECT_REF']}/database/query"
          token = os.environ["MANAGEMENT_TOKEN"]

          def query(sql):
              request = urllib.request.Request(
                  url,
                  data=json.dumps({"query": sql}).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "quickserve-0019-ci",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      return json.loads(response.read().decode() or "[]")
              except urllib.error.HTTPError as error:
                  raise SystemExit(
                      f"Supabase Management API query failed ({error.code}): {error.read().decode()}"
                  )

          core = query(
              "select exists(select 1 from supabase_migrations.schema_migrations "
              "where version = '0018') as applied"
          )
          if not core or not core[0].get("applied"):
              raise SystemExit("0018 is not live; refusing to apply 0019.")
          applied = query(
              "select exists(select 1 from supabase_migrations.schema_migrations "
              "where version = '0019') as applied"
          )
          if applied and applied[0].get("applied"):
              print("0019 already applied; continuing with transactional live verification.")
          else:
              migration = pathlib.Path(
                  "supabase/migrations/0019_fixed_package_booking.sql"
              ).read_text()
              query("begin;\n" + migration + "\nrollback;")
              print("0019 dry run succeeded.")
              query(
                  "begin;\n"
                  + migration
                  + "\ninsert into supabase_migrations.schema_migrations(version) "
                    "values ('0019') on conflict (version) do nothing;\n"
                    "commit;"
              )
              print("0019 applied and migration version recorded.")

          verification = r"""
          begin;
          do $verify$
          declare
            v_package_id uuid;
            v_provider_id uuid;
            v_city text;
            v_customer_id uuid;
            v_booking_id uuid;
            v_start timestamptz;
            v_end timestamptz;
            v_provider_service_id uuid;
            v_category_id uuid;
            v_price int;
            v_duration int;
            v_lat double precision;
            v_lng double precision;
          begin
            v_start := now() + interval '1 day';
            v_end := v_start + interval '2 hours';
            select sp.id, ps.provider_id, p.city, sp.duration_min
              into v_package_id, v_provider_id, v_city, v_duration
              from public.service_packages sp
              join public.provider_services ps on ps.id = sp.provider_service_id
              join public.providers p on p.id = ps.provider_id
              join public.categories c on c.id = ps.category_id
             where sp.active and sp.price_type = 'fixed'
               and c.archetype = 'fixed'
               and public._is_bookable(c.id, p.id, p.city, 'fixed', tstzrange(v_start, v_end, '[)'))
             order by sp.created_at desc
             limit 1;
            if v_package_id is null then
              select ps.id, ps.provider_id, ps.category_id, p.city
                into v_provider_service_id, v_provider_id, v_category_id, v_city
                from public.provider_services ps
                join public.providers p on p.id = ps.provider_id
                join public.categories c on c.id = ps.category_id
               where ps.active
                 and c.slug in ('house-cleaning', 'water-tank-cleaning', 'pest-control')
                 and public._provider_is_live(p.id)
                 and not p.paused
                 and public._category_docs_ok(p.id, c.id)
               order by ps.created_at desc
               limit 1;
              if v_provider_service_id is null then
                raise exception 'no eligible provider service available for fixed booking verification';
              end if;
              update public.categories
                 set archetype = 'fixed',
                     payment_template = 'full_upfront',
                     cancellation_policy = 'fixed_flexible',
                     config_version = config_version + 1
               where id = v_category_id;
              insert into public.category_cities(category_id, city, live, launched_at)
              values (v_category_id, v_city, true, now())
              on conflict (category_id, city) do update
              set live = true,
                  launched_at = coalesce(public.category_cities.launched_at, excluded.launched_at);
              select coalesce(
                (
                  select greatest("min", least("max", 12000))
                    from public.price_bands
                   where category_id = v_category_id
                     and lower(trim(city)) = lower(trim(v_city))
                     and unit = 'job'
                     and active
                   limit 1
                ),
                12000
              ) into v_price;
              insert into public.service_packages(
                provider_service_id, title, description, price_type, price, price_min, price_max,
                unit, qty_min, qty_max, duration_min, active
              ) values (
                v_provider_service_id, 'CI fixed booking verification', 'Rolled back after verification',
                'fixed', v_price, v_price, v_price, 'job', 1, 1, 90, true
              ) returning id into v_package_id;
            end if;
            -- The window must cover the package duration (e.g. a 3-hour deep clean).
            v_end := v_start + make_interval(mins => greatest(coalesce(v_duration, 0), 120));
            -- Book at the provider's own base so the address is always inside their service radius.
            select coalesce(extensions.st_y(p.base_location::extensions.geometry), 16.5),
                   coalesce(extensions.st_x(p.base_location::extensions.geometry), 80.6)
              into v_lat, v_lng
              from public.providers p
             where p.id = v_provider_id;
            select id into v_customer_id
              from public.profiles
             where id <> v_provider_id and role_customer
             order by created_at
             limit 1;
            if v_customer_id is null then
              raise exception 'no customer available for fixed booking verification';
            end if;
            perform set_config('request.jwt.claim.sub', v_customer_id::text, true);
            select public.create_fixed_booking(
              v_package_id,
              1,
              tstzrange(v_start, v_end, '[)'),
              jsonb_build_object(
                'mode', 'at_customer',
                'address_line', 'Migration verification only',
                'city', v_city,
                'lat', v_lat,
                'lng', v_lng
              ),
              '{"verification":"0019"}'::jsonb
            ) into v_booking_id;
            if not exists (
              select 1 from public.payment_schedule
               where booking_id = v_booking_id and status = 'due'
            ) then
              raise exception 'fixed booking verification produced no due obligation';
            end if;
          end;
          $verify$;
          rollback;
          """
          query(verification)
          print("0019 live fixed-booking verification succeeded (rolled back fixture).")
          PY

      - name: Apply migrations 0020-0024 through the Management API
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != ''
        env:
          MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MANAGEMENT_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          url = f"https://api.supabase.com/v1/projects/{os.environ['MANAGEMENT_PROJECT_REF']}/database/query"
          token = os.environ["MANAGEMENT_TOKEN"]

          def query(sql):
              request = urllib.request.Request(
                  url,
                  data=json.dumps({"query": sql}).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "quickserve-0020-0023-ci",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      return json.loads(response.read().decode() or "[]")
              except urllib.error.HTTPError as error:
                  raise SystemExit(
                      f"Supabase Management API query failed ({error.code}): {error.read().decode()}"
                  )

          def applied(version):
              rows = query(
                  "select exists(select 1 from supabase_migrations.schema_migrations "
                  f"where version = '{version}') as applied"
              )
              return bool(rows and rows[0].get("applied"))

          if not applied("0019"):
              raise SystemExit("0019 is not live; refusing to apply 0020-0024.")

          # Each migration commits on its own: 0023 uses enum labels that 0020 must commit first.
          for version, name in [
              ("0020", "0020_proposal_enum_values.sql"),
              ("0021", "0021_cancellation_availability_payouts.sql"),
              ("0022", "0022_time_based_booking.sql"),
              ("0023", "0023_proposal_milestone_booking.sql"),
              ("0024", "0024_activate_creator_event_categories.sql"),
              ("0025", "0025_targeted_proposal_requests.sql"),
              ("0026", "0026_fix_proposal_prepare_payment.sql"),
              ("0027", "0027_restore_fixed_prepare_payment.sql"),
              ("0028", "0028_auto_approve_provider_links.sql"),
              ("0029", "0029_single_due_payment.sql"),
              ("0030", "0030_review_fixes.sql"),
              ("0031", "0031_holiday_mode_enforcement.sql"),
              ("0032", "0032_notification_centre.sql"),
              ("0033", "0033_city_waitlist.sql"),
              ("0034", "0034_targeted_request_radius.sql"),
              ("0035", "0035_request_coordinates.sql"),
              ("0036", "0036_provider_service_city.sql"),
              ("0037", "0037_proposal_validity_cap.sql"),
          ]:
              if applied(version):
                  print(f"{version} already applied; skipped.")
                  continue
              migration = pathlib.Path(f"supabase/migrations/{name}").read_text()
              query("begin;\n" + migration + "\nrollback;")
              print(f"{version} dry run succeeded.")
              query(
                  "begin;\n"
                  + migration
                  + "\ninsert into supabase_migrations.schema_migrations(version) "
                    f"values ('{version}') on conflict (version) do nothing;\n"
                    "commit;"
              )
              print(f"{version} applied and migration version recorded.")
          PY

      - name: Set function secrets (only those provided)
        run: |
          args=()
          for v in RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET RAZORPAYX_ACCOUNT_NUMBER RAZORPAYX_WEBHOOK_SECRET CRON_SECRET GEMINI_API_KEY EXPO_ACCESS_TOKEN; do
            [ -n "${!v}" ] && args+=("$v=${!v}")
          done
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --project-ref "$PROJECT_REF" --yes "${args[@]}"
          else
            echo "No Razorpay/cron secrets yet; payments won't work until they're added."
          fi

      - name: Deploy Edge Functions
        run: |
          # User-facing functions verify the caller's JWT at the gateway.
          for f in create-payment ai-assistant provider-payout-account provider-service; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --yes
          done
          for f in razorpay-webhook release-payouts process-refunds send-notifications review-insights; do
            supabase functions deploy "$f" --no-verify-jwt --project-ref "$PROJECT_REF" --yes
          done

      - name: Summary
        run: |
          {
            echo "### Supabase backend deployed"
            echo "- Project: https://supabase.com/dashboard/project/$PROJECT_REF"
            echo "- Razorpay webhook URL: \`https://$PROJECT_REF.supabase.co/functions/v1/razorpay-webhook\`"
          } >> "$GITHUB_STEP_SUMMARY"
