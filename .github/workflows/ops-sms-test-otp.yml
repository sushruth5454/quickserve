name: Ops - update SMS test OTP list (one-time)

# One-time owner-approved maintenance (2026-11-18): add the dedicated admin E2E test phone and remove the
# retired public admin phone from Supabase Auth `sms_test_otp`. Other entries are preserved. Delete after use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update sms_test_otp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ADD_PHONE: '919000000901'
          ADD_OTP: '123456'
          REMOVE_PHONE: '918888888888'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/config/auth"
          hdr = {"Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}", "Content-Type": "application/json"}
          cfg = json.load(urllib.request.urlopen(urllib.request.Request(base, headers=hdr)))
          raw = cfg.get("sms_test_otp") or ""
          entries = [e.strip() for e in raw.split(",") if e.strip()]
          pairs = dict(e.split("=", 1) for e in entries if "=" in e)
          print("before:", sorted(pairs))
          pairs.pop(os.environ["REMOVE_PHONE"], None)
          pairs[os.environ["ADD_PHONE"]] = os.environ["ADD_OTP"]
          new = ",".join(f"{k}={v}" for k, v in pairs.items())
          body = {"sms_test_otp": new}
          valid = cfg.get("sms_test_otp_valid_until")
          print("valid_until:", valid)
          if valid: body["sms_test_otp_valid_until"] = valid
          req = urllib.request.Request(base, data=json.dumps(body).encode(), headers=hdr, method="PATCH")
          try:
              urllib.request.urlopen(req).read()
          except urllib.error.HTTPError as e:
              print("PATCH failed:", e.code, e.read().decode()[:500]); raise
          after = json.load(urllib.request.urlopen(urllib.request.Request(base, headers=hdr))).get("sms_test_otp") or ""
          phones = sorted(e.split("=", 1)[0] for e in after.split(",") if "=" in e)
          print("after:", phones)
          assert os.environ["ADD_PHONE"] in phones, "admin test phone missing after update"
          assert os.environ["REMOVE_PHONE"] not in phones, "retired phone still present"
          PY
