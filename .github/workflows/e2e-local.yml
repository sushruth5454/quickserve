name: E2E web (local Supabase)

# Same smoke test as e2e-web.yml, but against a throwaway Supabase stack started inside the runner:
# the full migration chain from this branch is applied, then the demo seeds. No shared backend, so
# runs execute in parallel and DB batches get E2E before merge. Uses no hosted Supabase project credentials.
on:
  push:
    branches: ['integrate/**']
  workflow_dispatch:

concurrency:
  group: e2e-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    concurrency:
      group: local-supabase-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_FORCE_TEST_LOCATION: '1'
      EXPO_PUBLIC_DEMO_CITY: 'Vijayawada Demo'
      EXPO_PUBLIC_DEMO_PAYMENT: '1'
      TARGET_SDK: '58'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Start local Supabase (migrations + demo seeds)
        env:
          GUEST_E2E_PHONE: '9000000999' # local-only synthetic phone; no repository secret
        run: bash scripts/ci/local-supabase.sh

      - name: Install app dependencies (public npm, same as e2e-web)
        working-directory: app
        run: |
          rm -f package-lock.json
          npm config set registry https://registry.npmjs.org/
          npm install --no-audit --no-fund --legacy-peer-deps
          CURRENT=$(node -p 'require("expo/package.json").version.split(".")[0]')
          if [ "$CURRENT" != "$TARGET_SDK" ]; then
            npm install "expo@~$TARGET_SDK.0.0" --no-audit --no-fund --legacy-peer-deps
            CI=1 npx expo install --fix -- --legacy-peer-deps
          fi
          CI=1 npx expo install react-native-web react-dom @expo/metro-runtime expo-audio expo-file-system expo-speech expo-notifications expo-image-manipulator expo-document-picker -- --legacy-peer-deps

      - name: Build web against local Supabase
        working-directory: app
        run: |
          EXPO_PUBLIC_SUPABASE_URL="$LOCAL_API_URL" EXPO_PUBLIC_SUPABASE_ANON_KEY="$LOCAL_ANON_KEY" \
            npx expo export --platform web --output-dir dist

      - name: Serve web build and local Management API stand-in
        run: |
          (cd app && npx --yes serve@14 -s dist -l 8081 > ../serve.log 2>&1 &)
          python3 scripts/ci/mock-mgmt-api.py > mgmt.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8081 > /dev/null && exit 0; sleep 1; done
          cat serve.log; exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium

      - name: Pin the feature switches the smoke test expects
        id: pin_flags
        env:
          SUPABASE_ACCESS_TOKEN: local
          PROJECT_REF: local
          SUPABASE_MGMT_URL: http://127.0.0.1:54399
          E2E_FLAGS_STATE: ${{ runner.temp }}/e2e-flags-local-snapshot.json
        run: python3 scripts/ci/e2e-flags.py pin

      - name: Test guest OTP expiry normalization
        id: test_otp_expiry
        run: python3 scripts/ci/test-e2e-guest-otp.py

      - name: Test E2E demo-state safety guards
        id: test_demo_state
        run: python3 scripts/ci/test-e2e-demo-state.py

      - name: Set legacy feature switches OFF
        id: legacy_flags
        if: ${{ always() && steps.pin_flags.outcome == 'success' }}
        env:
          SUPABASE_ACCESS_TOKEN: local
          PROJECT_REF: local
          SUPABASE_MGMT_URL: http://127.0.0.1:54399
        run: python3 scripts/ci/e2e-flags.py legacy-off

      - name: Run legacy smoke test (redesign switches OFF)
        id: pass_a
        if: ${{ always() && steps.legacy_flags.outcome == 'success' }}
        continue-on-error: true
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8081
          SHOTS_DIR: ${{ github.workspace }}/e2e-shots
          DEMO_PROJECT: '1'
          ADMIN_E2E_PHONE: '9000000901'
          SUPABASE_ACCESS_TOKEN: local
          PROJECT_REF: local
          SUPABASE_MGMT_URL: http://127.0.0.1:54399
          E2E_AI_UNAVAILABLE: '1'
          NEW_PRO_PHONE: '9000000301'
          GUEST_E2E_PHONE: '9000000999'
          QA_MARKER: 'QA-E2E local ${{ github.run_id }}-${{ github.run_attempt }}'
        run: SUPABASE_URL="$LOCAL_API_URL" SUPABASE_ANON_KEY="$LOCAL_ANON_KEY" node web-smoke.mjs

      - name: Archive legacy smoke artifacts
        if: always() && steps.pass_a.outcome != 'skipped'
        run: |
          mkdir -p e2e-shots/pass-a
          find e2e-shots -maxdepth 1 -type f ! -name 'otp-cooldowns.json' -exec mv {} e2e-shots/pass-a/ \;

      - name: Remove Pass A QA data
        id: cleanup_pass_a
        if: always() && steps.pass_a.outcome != 'skipped'
        env:
          SUPABASE_ACCESS_TOKEN: local
          PROJECT_REF: local
          SUPABASE_MGMT_URL: http://127.0.0.1:54399
          DEMO_PROJECT: '1'
          QA_MARKER: 'QA-E2E local ${{ github.run_id }}-${{ github.run_attempt }}'
        run: python3 scripts/ci/e2e-demo-state.py cleanup-qa

      - name: Reset private demo fixtures for Pass B
        id: reset_pass_b_demo
        if: always() && steps.cleanup_pass_a.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: local
          PROJECT_REF: local
          SUPABASE_MGMT_URL: http://127.0.0.1:54399
          DEMO_PROJECT: '1'
        run: python3 scripts/ci/e2e-demo-state.py reset

      - name: Restore hosted demo settings for Pass B
        id: seed_settings_pass_b
        if: always() && steps.reset_pass_b_demo.outcome == 'success'
        env:
          LOCAL_DB_URL: ${{ env.LOCAL_DB_URL }}
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed-e2e-settings.sql

      - name: Reseed local Sangareddy fixtures for Pass B
        id: reseed_sangareddy_pass_b
        if: always() && steps.seed_settings_pass_b.outcome == 'success'
        env:
          LOCAL_DB_URL: ${{ env.LOCAL_DB_URL }}
        run: |
          sed '0,/^begin;$/s//begin;\nselect set_config('"'"'quickserve.demo_seed'"'"', '"'"'1'"'"', true);/' supabase/seed-sangareddy.sql \
            | psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -q

      - name: Reset fresh provider test account for Pass B
        id: reset_new_pro_pass_b
        if: always() && steps.reseed_sangareddy_pass_b.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: local
          PROJECT_REF: local
          SUPABASE_MGMT_URL: http://127.0.0.1:54399
          DEMO_PROJECT: '1'
        run: python3 scripts/ci/e2e-demo-state.py reset-fresh-provider

      - name: Set redesign feature switches ON
        id: redesign_flags
        if: ${{ always() && steps.reset_new_pro_pass_b.outcome == 'success' }}
        env:
          SUPABASE_ACCESS_TOKEN: local
          PROJECT_REF: local
          SUPABASE_MGMT_URL: http://127.0.0.1:54399
        run: python3 scripts/ci/e2e-flags.py redesign-on

      - name: Prepare guest OTP helper state against local Management API
        id: guest_otp_prepare
        if: ${{ always() && steps.redesign_flags.outcome == 'success' }}
        env:
          SUPABASE_ACCESS_TOKEN: local
          PROJECT_REF: local
          SUPABASE_MGMT_URL: http://127.0.0.1:54399
          DEMO_PROJECT: '1'
          E2E_CUSTOMER_PHONE: '9999999999'
          NEW_PRO_PHONE: '9000000301'
          ADMIN_E2E_PHONE: '9000000901'
          GUEST_E2E_PHONE: '9000000999'
          GUEST_OTP_STATE: ${{ runner.temp }}/guest-otp-local-snapshot.json
        run: python3 scripts/ci/e2e-guest-otp.py prepare

      - name: Run redesigned smoke test (redesign switches ON)
        id: pass_b
        if: ${{ always() && steps.guest_otp_prepare.outcome == 'success' }}
        continue-on-error: true
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8081
          SHOTS_DIR: ${{ github.workspace }}/e2e-shots
          DEMO_PROJECT: '1'
          ADMIN_E2E_PHONE: '9000000901'
          SUPABASE_ACCESS_TOKEN: local
          PROJECT_REF: local
          SUPABASE_MGMT_URL: http://127.0.0.1:54399
          E2E_AI_UNAVAILABLE: '1'
          NEW_PRO_PHONE: '9000000301'
          GUEST_E2E_PHONE: '9000000999'
          O28_OWNER_A_PHONE: '9000000801'
          O28_OWNER_B_PHONE: '9000000802'
          O27_OWNER_PHONE: '9000000701'
          O27_CUSTOMER_PHONE: '9000000702'
          QA_MARKER: 'QA-E2E local ${{ github.run_id }}-${{ github.run_attempt }}'
          E2E_FLAGS: 'on'
        run: SUPABASE_URL="$LOCAL_API_URL" SUPABASE_ANON_KEY="$LOCAL_ANON_KEY" node web-smoke.mjs

      - name: Archive redesigned smoke artifacts
        if: always() && steps.pass_b.outcome != 'skipped'
        run: |
          mkdir -p e2e-shots/pass-b
          find e2e-shots -maxdepth 1 -type f ! -name 'otp-cooldowns.json' -exec mv {} e2e-shots/pass-b/ \;

      - name: Restore guest OTP helper state
        id: restore_guest_otp
        if: always() && steps.guest_otp_prepare.outcome != 'skipped'
        env:
          SUPABASE_ACCESS_TOKEN: local
          PROJECT_REF: local
          SUPABASE_MGMT_URL: http://127.0.0.1:54399
          DEMO_PROJECT: '1'
          GUEST_E2E_PHONE: '9000000999'
          GUEST_OTP_STATE: ${{ runner.temp }}/guest-otp-local-snapshot.json
        run: python3 scripts/ci/e2e-guest-otp.py restore

      - name: Verify guest OTP helper state restoration
        id: verify_guest_otp
        if: always() && steps.guest_otp_prepare.outcome != 'skipped'
        env:
          SUPABASE_ACCESS_TOKEN: local
          PROJECT_REF: local
          SUPABASE_MGMT_URL: http://127.0.0.1:54399
          DEMO_PROJECT: '1'
          GUEST_E2E_PHONE: '9000000999'
          GUEST_OTP_STATE: ${{ runner.temp }}/guest-otp-local-snapshot.json
        run: python3 scripts/ci/e2e-guest-otp.py verify

      - name: Clean up local guest OTP test account
        id: cleanup_guest_otp
        if: always() && steps.guest_otp_prepare.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: local
          PROJECT_REF: local
          SUPABASE_MGMT_URL: http://127.0.0.1:54399
          DEMO_PROJECT: '1'
          GUEST_E2E_PHONE: '9000000999'
        run: python3 scripts/ci/e2e-guest-otp.py cleanup

      - name: Remove Pass B QA data
        id: cleanup_final
        if: always() && steps.pass_b.outcome != 'skipped'
        env:
          SUPABASE_ACCESS_TOKEN: local
          PROJECT_REF: local
          SUPABASE_MGMT_URL: http://127.0.0.1:54399
          DEMO_PROJECT: '1'
          QA_MARKER: 'QA-E2E local ${{ github.run_id }}-${{ github.run_attempt }}'
        run: python3 scripts/ci/e2e-demo-state.py cleanup-qa

      - name: Remove local guest OTP snapshot
        if: always()
        env:
          GUEST_OTP_STATE: ${{ runner.temp }}/guest-otp-local-snapshot.json
        run: rm -f "$GUEST_OTP_STATE"

      - name: Restore local feature switches
        id: restore_flags
        if: ${{ always() && steps.pin_flags.outcome != 'skipped' }}
        env:
          SUPABASE_ACCESS_TOKEN: local
          PROJECT_REF: local
          SUPABASE_MGMT_URL: http://127.0.0.1:54399
          E2E_FLAGS_STATE: ${{ runner.temp }}/e2e-flags-local-snapshot.json
        run: python3 scripts/ci/e2e-flags.py restore

      - name: Verify local feature switches were restored
        id: verify_flags
        if: ${{ always() && steps.pin_flags.outcome != 'skipped' }}
        env:
          SUPABASE_ACCESS_TOKEN: local
          PROJECT_REF: local
          SUPABASE_MGMT_URL: http://127.0.0.1:54399
          E2E_FLAGS_STATE: ${{ runner.temp }}/e2e-flags-local-snapshot.json
        run: python3 scripts/ci/e2e-flags.py verify

      - name: Remove local feature flag snapshot
        if: always()
        env:
          E2E_FLAGS_STATE: ${{ runner.temp }}/e2e-flags-local-snapshot.json
        run: rm -f "$E2E_FLAGS_STATE"

      - name: Fail if either smoke pass or restoration failed
        if: always()
        env:
          PIN_FLAGS_OUTCOME: ${{ steps.pin_flags.outcome }}
          LEGACY_FLAGS_OUTCOME: ${{ steps.legacy_flags.outcome }}
          PASS_A_OUTCOME: ${{ steps.pass_a.outcome }}
          TEST_OTP_OUTCOME: ${{ steps.test_otp_expiry.outcome }}
          TEST_DEMO_STATE_OUTCOME: ${{ steps.test_demo_state.outcome }}
          CLEANUP_PASS_A_OUTCOME: ${{ steps.cleanup_pass_a.outcome }}
          RESET_PASS_B_DEMO_OUTCOME: ${{ steps.reset_pass_b_demo.outcome }}
          SEED_SETTINGS_PASS_B_OUTCOME: ${{ steps.seed_settings_pass_b.outcome }}
          RESEED_SANGAREDDY_OUTCOME: ${{ steps.reseed_sangareddy_pass_b.outcome }}
          RESET_NEW_PRO_PASS_B_OUTCOME: ${{ steps.reset_new_pro_pass_b.outcome }}
          REDESIGN_FLAGS_OUTCOME: ${{ steps.redesign_flags.outcome }}
          PREPARE_GUEST_OTP_OUTCOME: ${{ steps.guest_otp_prepare.outcome }}
          PASS_B_OUTCOME: ${{ steps.pass_b.outcome }}
          RESTORE_GUEST_OTP_OUTCOME: ${{ steps.restore_guest_otp.outcome }}
          VERIFY_GUEST_OTP_OUTCOME: ${{ steps.verify_guest_otp.outcome }}
          CLEANUP_GUEST_OTP_OUTCOME: ${{ steps.cleanup_guest_otp.outcome }}
          CLEANUP_FINAL_OUTCOME: ${{ steps.cleanup_final.outcome }}
          RESTORE_FLAGS_OUTCOME: ${{ steps.restore_flags.outcome }}
          VERIFY_FLAGS_OUTCOME: ${{ steps.verify_flags.outcome }}
        run: |
          for outcome in "$PIN_FLAGS_OUTCOME" "$TEST_OTP_OUTCOME" "$TEST_DEMO_STATE_OUTCOME" "$LEGACY_FLAGS_OUTCOME" "$PASS_A_OUTCOME" "$CLEANUP_PASS_A_OUTCOME" "$RESET_PASS_B_DEMO_OUTCOME" "$SEED_SETTINGS_PASS_B_OUTCOME" "$RESEED_SANGAREDDY_OUTCOME" "$RESET_NEW_PRO_PASS_B_OUTCOME" "$REDESIGN_FLAGS_OUTCOME" "$PREPARE_GUEST_OTP_OUTCOME" "$PASS_B_OUTCOME" "$RESTORE_GUEST_OTP_OUTCOME" "$VERIFY_GUEST_OTP_OUTCOME" "$CLEANUP_GUEST_OTP_OUTCOME" "$CLEANUP_FINAL_OUTCOME" "$RESTORE_FLAGS_OUTCOME" "$VERIFY_FLAGS_OUTCOME"; do
            if [ "$outcome" != "success" ]; then
              echo "Local E2E gate failed; step outcome: $outcome"
              exit 1
            fi
          done

      - name: Backend logs on failure
        if: failure()
        run: |
          cat mgmt.log || true
          docker ps --format '{{.Names}}' | grep -E 'auth|rest|edge' | while read c; do echo "== $c"; docker logs --tail 80 "$c" 2>&1; done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-local-screenshots
          path: e2e-shots
          retention-days: 7
