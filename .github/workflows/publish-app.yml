name: Publish app to Expo Go (EAS Update)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**']

concurrency: publish-app

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      UPDATE_MESSAGE: ${{ github.event.head_commit.message || 'Manual publish' }}
      SDK_RUNTIME: exposdk:57.0.0
    steps:
      - name: Check required secrets
        working-directory: .
        run: |
          missing=""
          for v in EXPO_TOKEN EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies (public npm)
        run: |
          rm -f package-lock.json
          npm config set registry https://registry.npmjs.org/
          npm install --no-audit --no-fund
          npx expo install expo-updates

      - name: Link EAS project
        run: eas init --non-interactive --force

      - name: Point updates at Expo Go (SDK 57)
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const id = cfg.expo.extra && cfg.expo.extra.eas && cfg.expo.extra.eas.projectId;
            if (!id) { console.error("No EAS projectId after eas init"); process.exit(1); }
            cfg.expo.runtimeVersion = process.env.SDK_RUNTIME;
            cfg.expo.updates = { url: "https://u.expo.dev/" + id };
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2) + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "EAS_PROJECT_ID=" + id + "\n");
          '

      - name: Publish update
        run: |
          eas update --branch preview --platform all --non-interactive --json \
            --message "$(echo "$UPDATE_MESSAGE" | head -n1)" > update.json
          cat update.json

      - name: Expo Go link
        run: |
          GROUP=$(node -e 'const u=require("./update.json"); console.log((Array.isArray(u)?u[0]:u).group)')
          LINK=$(curl -fsS "https://qr.expo.dev/eas-update?slug=exp&projectId=$EAS_PROJECT_ID&groupId=$GROUP&format=url")
          QR="https://qr.expo.dev/eas-update?slug=exp&projectId=$EAS_PROJECT_ID&groupId=$GROUP"
          echo "Expo Go link: $LINK"
          {
            echo "## Open QuickServe in Expo Go"
            echo "On your iPhone, sign in to Expo Go with the same Expo account, then tap this link:"
            echo ""
            echo "**$LINK**"
            echo ""
            echo "Or scan from another screen:"
            echo ""
            echo "![QR]($QR)"
          } >> "$GITHUB_STEP_SUMMARY"
