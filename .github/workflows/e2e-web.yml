name: E2E web smoke test

on:
  push:
    # App-only changes run directly. Commits that also trigger deploy-backend are deferred to workflow_run below.
    branches: [main]
    paths:
      - 'app/**'
      - 'supabase/seed-all-services.sql'
      - 'e2e/**'
      - '.github/workflows/e2e-web.yml'
  workflow_run:
    workflows: ['Deploy backend (Supabase)']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-shared-backend
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.gate.outputs.run_e2e }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Choose serialized E2E trigger
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            [[ "$DEPLOY_CONCLUSION" == "success" ]] && echo "run_e2e=true" >> "$GITHUB_OUTPUT" || echo "run_e2e=false" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$REF_NAME" == "refs/heads/main" ]] && echo "run_e2e=true" >> "$GITHUB_OUTPUT" || echo "run_e2e=false" >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only "$BEFORE_SHA" "$EVENT_SHA")
            if grep -Eq '^(supabase/migrations/|supabase/functions/|supabase/tests/|scripts/ci/|\.github/workflows/deploy-backend\.yml$)' <<< "$changed"; then
              echo "run_e2e=false" >> "$GITHUB_OUTPUT"
            else
              echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  e2e:
    needs: gate
    if: needs.gate.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_FORCE_TEST_LOCATION: '1'
      EXPO_PUBLIC_DEMO_CITY: 'Vijayawada Demo'
      EXPO_PUBLIC_DEMO_PAYMENT: '1'
      TARGET_SDK: '58'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies (public npm, same as publish-app)
        working-directory: app
        run: |
          rm -f package-lock.json
          npm config set registry https://registry.npmjs.org/
          npm install --no-audit --no-fund --legacy-peer-deps
          CURRENT=$(node -p 'require("expo/package.json").version.split(".")[0]')
          if [ "$CURRENT" != "$TARGET_SDK" ]; then
            npm install "expo@~$TARGET_SDK.0.0" --no-audit --no-fund --legacy-peer-deps
            CI=1 npx expo install --fix -- --legacy-peer-deps
          fi
          CI=1 npx expo install react-native-web react-dom @expo/metro-runtime expo-audio expo-file-system expo-speech expo-notifications expo-image-manipulator expo-document-picker -- --legacy-peer-deps
          node -p '"Using expo " + require("expo/package.json").version'

      - name: Build web
        working-directory: app
        run: npx expo export --platform web --output-dir dist

      - name: Serve web build
        working-directory: app
        run: |
          npx --yes serve@14 -s dist -l 8081 > ../serve.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8081 > /dev/null && exit 0; sleep 1; done
          cat ../serve.log; exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium

      - name: Reset the fresh-provider test user
        # The onboarding e2e signs up NEW_PRO_PHONE as a brand-new provider every run (no seed data). Deleting the
        # auth user cascades to its profile/provider rows. The number must be in the project's sms_test_otp list.
        id: reset_new_pro
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DEMO_PROJECT: ${{ vars.DEMO_PROJECT }}
        run: python3 scripts/ci/e2e-demo-state.py reset-fresh-provider

      - name: Reset all-service demo data (DEMO project only)
        id: reset_demo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DEMO_PROJECT: ${{ vars.DEMO_PROJECT }}
        run: python3 scripts/ci/e2e-demo-state.py reset

      - name: Dump hosted settings after a reset failure
        if: failure() && steps.reset_demo.outcome == 'failure'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          request = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/query",
              data=json.dumps({"query": Path("scripts/ci/state-dump.sql").read_text()}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.loads(response.read())
          except urllib.error.HTTPError as error:
              print(f"Hosted settings snapshot unavailable (HTTP {error.code})")
              sys.exit(1)
          if isinstance(result, list) and result and isinstance(result[0], dict):
              state = result[0].get("state")
          elif isinstance(result, dict):
              state = result.get("state")
          else:
              state = None
          if isinstance(state, str):
              state = json.loads(state)
          if not isinstance(state, dict):
              print("Hosted settings snapshot returned an unexpected shape")
              sys.exit(1)
          print(json.dumps(state, indent=2, sort_keys=True, ensure_ascii=False))
          PY

      - name: Pin the feature switches the smoke test expects (restored afterwards)
        id: pin_flags
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          E2E_FLAGS_STATE: flags-snapshot.json
        run: python3 scripts/ci/e2e-flags.py pin

      - name: Set legacy feature switches OFF
        id: legacy_flags
        if: ${{ steps.pin_flags.outcome == 'success' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 scripts/ci/e2e-flags.py legacy-off

      - name: Run legacy smoke test (redesign switches OFF)
        id: pass_a
        if: ${{ steps.legacy_flags.outcome == 'success' }}
        continue-on-error: true
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8081
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SHOTS_DIR: ${{ github.workspace }}/e2e-shots
          DEMO_PROJECT: ${{ vars.DEMO_PROJECT }}
          ADMIN_E2E_PHONE: ${{ secrets.ADMIN_E2E_PHONE }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          NEW_PRO_PHONE: '9000000301'
          QA_MARKER: 'QA-E2E web-smoke ${{ github.run_id }}-${{ github.run_attempt }}'
        run: node web-smoke.mjs

      - name: Archive legacy smoke artifacts (preserve OTP cooldown state)
        if: always() && steps.pass_a.outcome != 'skipped'
        run: |
          mkdir -p e2e-shots/pass-a
          find e2e-shots -maxdepth 1 -type f ! -name 'otp-cooldowns.json' -exec mv {} e2e-shots/pass-a/ \;

      - name: Remove Pass A QA data
        id: cleanup_pass_a
        if: always() && steps.pass_a.outcome != 'skipped'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DEMO_PROJECT: ${{ vars.DEMO_PROJECT }}
          QA_MARKER: 'QA-E2E web-smoke ${{ github.run_id }}-${{ github.run_attempt }}'
        run: python3 scripts/ci/e2e-demo-state.py cleanup-qa

      - name: Reset demo fixtures for Pass B
        id: reset_pass_b_demo
        if: always() && steps.cleanup_pass_a.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DEMO_PROJECT: ${{ vars.DEMO_PROJECT }}
        run: python3 scripts/ci/e2e-demo-state.py reset

      - name: Reset fresh-provider test user for Pass B
        id: reset_new_pro_pass_b
        if: always() && steps.reset_pass_b_demo.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DEMO_PROJECT: ${{ vars.DEMO_PROJECT }}
        run: python3 scripts/ci/e2e-demo-state.py reset-fresh-provider

      - name: Set redesign feature switches ON
        id: redesign_flags
        if: ${{ always() && steps.reset_new_pro_pass_b.outcome == 'success' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 scripts/ci/e2e-flags.py redesign-on

      - name: Prepare fresh guest OTP test account
        id: prepare_guest_otp
        if: ${{ always() && steps.redesign_flags.outcome == 'success' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DEMO_PROJECT: ${{ vars.DEMO_PROJECT }}
          E2E_CUSTOMER_PHONE: '9999999999'
          NEW_PRO_PHONE: '9000000301'
          ADMIN_E2E_PHONE: ${{ secrets.ADMIN_E2E_PHONE }}
          GUEST_E2E_PHONE: ${{ secrets.GUEST_E2E_PHONE }}
          GUEST_OTP_STATE: ${{ runner.temp }}/guest-otp-snapshot.json
        run: python3 scripts/ci/e2e-guest-otp.py prepare

      - name: Run redesigned smoke test (redesign switches ON)
        id: pass_b
        if: ${{ always() && steps.prepare_guest_otp.outcome == 'success' }}
        continue-on-error: true
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8081
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SHOTS_DIR: ${{ github.workspace }}/e2e-shots
          DEMO_PROJECT: ${{ vars.DEMO_PROJECT }}
          ADMIN_E2E_PHONE: ${{ secrets.ADMIN_E2E_PHONE }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          NEW_PRO_PHONE: '9000000301'
          GUEST_E2E_PHONE: ${{ secrets.GUEST_E2E_PHONE }}
          QA_MARKER: 'QA-E2E web-smoke ${{ github.run_id }}-${{ github.run_attempt }}'
          E2E_FLAGS: 'on'
        run: node web-smoke.mjs

      - name: Archive redesigned smoke artifacts
        if: always() && steps.pass_b.outcome != 'skipped'
        run: |
          mkdir -p e2e-shots/pass-b
          find e2e-shots -maxdepth 1 -type f ! -name 'otp-cooldowns.json' -exec mv {} e2e-shots/pass-b/ \;

      - name: Restore guest OTP test settings
        id: restore_guest_otp
        if: ${{ always() && steps.prepare_guest_otp.outcome != 'skipped' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DEMO_PROJECT: ${{ vars.DEMO_PROJECT }}
          GUEST_E2E_PHONE: ${{ secrets.GUEST_E2E_PHONE }}
          GUEST_OTP_STATE: ${{ runner.temp }}/guest-otp-snapshot.json
        run: python3 scripts/ci/e2e-guest-otp.py restore

      - name: Verify guest OTP test settings were restored
        id: verify_guest_otp
        if: ${{ always() && steps.prepare_guest_otp.outcome != 'skipped' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DEMO_PROJECT: ${{ vars.DEMO_PROJECT }}
          GUEST_E2E_PHONE: ${{ secrets.GUEST_E2E_PHONE }}
          GUEST_OTP_STATE: ${{ runner.temp }}/guest-otp-snapshot.json
        run: python3 scripts/ci/e2e-guest-otp.py verify

      - name: Remove guest OTP snapshot
        if: always()
        env:
          GUEST_OTP_STATE: ${{ runner.temp }}/guest-otp-snapshot.json
        run: rm -f "$GUEST_OTP_STATE"

      - name: Reset guest E2E test account
        id: reset_guest_user
        if: ${{ always() && steps.prepare_guest_otp.outcome == 'success' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DEMO_PROJECT: ${{ vars.DEMO_PROJECT }}
          GUEST_E2E_PHONE: ${{ secrets.GUEST_E2E_PHONE }}
        run: python3 scripts/ci/e2e-guest-otp.py cleanup

      - name: Restore the owner's feature switches
        id: restore_flags
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          E2E_FLAGS_STATE: flags-snapshot.json
        run: python3 scripts/ci/e2e-flags.py restore

      - name: Verify the owner's feature switches were restored
        id: verify_flags
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          E2E_FLAGS_STATE: flags-snapshot.json
        run: python3 scripts/ci/e2e-flags.py verify

      - name: Remove Pass B QA data
        id: cleanup_final
        if: always()
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DEMO_PROJECT: ${{ vars.DEMO_PROJECT }}
          QA_MARKER: 'QA-E2E web-smoke ${{ github.run_id }}-${{ github.run_attempt }}'
        run: python3 scripts/ci/e2e-demo-state.py cleanup-qa

      - name: Fail if any E2E pass, reset, cleanup, or restore failed
        if: always()
        env:
          RESET_NEW_PRO_OUTCOME: ${{ steps.reset_new_pro.outcome }}
          RESET_DEMO_OUTCOME: ${{ steps.reset_demo.outcome }}
          PIN_FLAGS_OUTCOME: ${{ steps.pin_flags.outcome }}
          LEGACY_FLAGS_OUTCOME: ${{ steps.legacy_flags.outcome }}
          PASS_A_OUTCOME: ${{ steps.pass_a.outcome }}
          CLEANUP_PASS_A_OUTCOME: ${{ steps.cleanup_pass_a.outcome }}
          RESET_PASS_B_DEMO_OUTCOME: ${{ steps.reset_pass_b_demo.outcome }}
          RESET_NEW_PRO_PASS_B_OUTCOME: ${{ steps.reset_new_pro_pass_b.outcome }}
          REDESIGN_FLAGS_OUTCOME: ${{ steps.redesign_flags.outcome }}
          PREPARE_GUEST_OTP_OUTCOME: ${{ steps.prepare_guest_otp.outcome }}
          PASS_B_OUTCOME: ${{ steps.pass_b.outcome }}
          RESTORE_GUEST_OTP_OUTCOME: ${{ steps.restore_guest_otp.outcome }}
          VERIFY_GUEST_OTP_OUTCOME: ${{ steps.verify_guest_otp.outcome }}
          RESET_GUEST_USER_OUTCOME: ${{ steps.reset_guest_user.outcome }}
          RESTORE_FLAGS_OUTCOME: ${{ steps.restore_flags.outcome }}
          VERIFY_FLAGS_OUTCOME: ${{ steps.verify_flags.outcome }}
          CLEANUP_FINAL_OUTCOME: ${{ steps.cleanup_final.outcome }}
        run: |
          for outcome in "$RESET_NEW_PRO_OUTCOME" "$RESET_DEMO_OUTCOME" "$PIN_FLAGS_OUTCOME" "$LEGACY_FLAGS_OUTCOME" "$PASS_A_OUTCOME" "$CLEANUP_PASS_A_OUTCOME" "$RESET_PASS_B_DEMO_OUTCOME" "$RESET_NEW_PRO_PASS_B_OUTCOME" "$REDESIGN_FLAGS_OUTCOME" "$PREPARE_GUEST_OTP_OUTCOME" "$PASS_B_OUTCOME" "$RESTORE_GUEST_OTP_OUTCOME" "$VERIFY_GUEST_OTP_OUTCOME" "$RESET_GUEST_USER_OUTCOME" "$RESTORE_FLAGS_OUTCOME" "$VERIFY_FLAGS_OUTCOME" "$CLEANUP_FINAL_OUTCOME"; do
            if [ "$outcome" != "success" ]; then
              echo "Hosted E2E gate failed; step outcome: $outcome"
              exit 1
            fi
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-shots
          retention-days: 14
