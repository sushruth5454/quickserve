name: E2E web smoke test

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'supabase/migrations/**'
      - 'e2e/**'
      - '.github/workflows/e2e-web.yml'
  workflow_dispatch:

concurrency: e2e-web

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_FORCE_TEST_LOCATION: '1'
      EXPO_PUBLIC_DEMO_CITY: 'Vijayawada Demo'
      EXPO_PUBLIC_DEMO_PAYMENT: '1'
      TARGET_SDK: '58'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies (public npm, same as publish-app)
        working-directory: app
        run: |
          rm -f package-lock.json
          npm config set registry https://registry.npmjs.org/
          npm install --no-audit --no-fund --legacy-peer-deps
          CURRENT=$(node -p 'require("expo/package.json").version.split(".")[0]')
          if [ "$CURRENT" != "$TARGET_SDK" ]; then
            npm install "expo@~$TARGET_SDK.0.0" --no-audit --no-fund --legacy-peer-deps
            CI=1 npx expo install --fix -- --legacy-peer-deps
          fi
          CI=1 npx expo install react-native-web react-dom @expo/metro-runtime expo-audio expo-file-system expo-speech expo-notifications expo-image-manipulator expo-document-picker -- --legacy-peer-deps
          node -p '"Using expo " + require("expo/package.json").version'

      - name: Build web
        working-directory: app
        run: npx expo export --platform web --output-dir dist

      - name: Serve web build
        working-directory: app
        run: |
          npx --yes serve@14 -s dist -l 8081 > ../serve.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8081 > /dev/null && exit 0; sleep 1; done
          cat ../serve.log; exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium

      - name: Reset the fresh-provider test user
        # The onboarding e2e signs up NEW_PRO_PHONE as a brand-new provider every run (no seed data). Deleting the
        # auth user cascades to its profile/provider rows. The number must be in the project's sms_test_otp list.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"query":"delete from auth.users where phone = '\''919000000301'\'' and not exists (select 1 from public.bookings b where b.provider_id = auth.users.id or b.customer_id = auth.users.id)"}'

      - name: Reset all-service demo data (DEMO project only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          sql = Path("supabase/seed-all-services.sql").read_text()
          sql = sql.replace(
              "begin;\n\n",
              "begin;\nselect set_config('quickserve.demo_seed', '1', true);\n\n",
              1,
          )
          Path("seed-all-services-request.json").write_text(json.dumps({"query": sql}))
          PY
          curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @seed-all-services-request.json
          rm seed-all-services-request.json

      - name: Run smoke test
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8081
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SHOTS_DIR: ${{ github.workspace }}/e2e-shots
          NEW_PRO_PHONE: '9000000301'
        run: node web-smoke.mjs

      - name: Remove QA-E2E rows created by the smoke test
        # Runs even when the test fails, so live data never accumulates test chats, requests or bookings.
        # Only rows the test marks with "QA-E2E" are touched. Bookings go first (they cascade to payments,
        # schedule rows and chat); requests then cascade to their proposals and recipients.
        if: always()
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          sql = """
          begin;
          create temp table qa_requests on commit drop as
            select id from public.service_requests where intake::text like '%QA-E2E%';
          create temp table qa_bookings on commit drop as
            select b.id from public.bookings b
             where b.service_request_id in (select id from qa_requests)
                or b.proposal_id in (select p.id from public.proposals p where p.note like 'QA-E2E%')
                or b.description like '%QA-E2E%';
          delete from public.bookings where id in (select id from qa_bookings);
          delete from public.service_requests where id in (select id from qa_requests);
          delete from public.messages where body like 'QA-E2E%';
          select (select count(*) from qa_bookings) as bookings_removed, (select count(*) from qa_requests) as requests_removed;
          commit;
          """
          Path("qa-cleanup-request.json").write_text(json.dumps({"query": sql}))
          PY
          curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data-binary @qa-cleanup-request.json
          rm qa-cleanup-request.json

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-shots
