button{font:inherit;cursor:pointer}h1,h2,h3,h4,p{margin:0}h1,h2,h3,h4,strong,b{font-family:Manrope,Arial,sans-serif}
.site-header{padding:26px 30px 18px;background:#fff;border-bottom:1px solid #d6dfe3}.site-title{display:flex;align-items:center;gap:14px;color:#006d77}
.brand-symbol{width:100%;height:100%;display:block}.site-title>.brand-symbol{width:43px;height:43px}.brand-wordmark{width:128px;height:32px}
.site-header h1{font-size:23px;margin-top:8px}.site-header p{margin:10px 0;color:#465c64;font-size:14px;max-width:1180px;line-height:1.55}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.controls button{border:1px solid #aebcc3;background:white;color:#243b45;border-radius:9px;padding:10px 15px;font-weight:600}
.controls button.selected{background:#006d77;color:white;border-color:#006d77}.view{padding:24px}.gallery{display:grid;grid-template-columns:repeat(5,390px);gap:22px;align-items:start;width:max-content}.concept{margin:0;width:390px;color:var(--text);font-size:14px;line-height:1.45}
figcaption{height:64px;color:#18282e;display:flex;flex-direction:column;justify-content:center;gap:5px;font-size:13px}figcaption span{color:#465c64;font-size:12px}
.phone{height:1000px;width:390px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #b6c4ca;border-radius:22px;background:var(--bg);box-shadow:0 10px 22px #172a3410}
.concept-label{flex:none;padding:9px 5px;text-align:center;background:var(--surfaceAlt);color:var(--textSecondary);border-bottom:1px solid var(--border);font-size:9px;letter-spacing:.55px}
.screen-main{flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding:20px 17px;display:flex;flex-direction:column;gap:18px}.screen-main::-webkit-scrollbar{display:none}
.icon{width:22px;height:22px;flex:none;display:inline-block;vertical-align:middle}.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:10px}.top{align-items:flex-start}
small{font-size:11px;color:var(--muted);display:block;line-height:1.45}h2{font-size:23px;line-height:1.25}h3{font-size:15px;line-height:1.45}h4{font-size:13px;margin-top:5px}p{font-size:12px;line-height:1.55;color:var(--textSecondary)}
.round{width:40px;height:40px;border-radius:20px;background:var(--surfaceAlt);color:var(--primaryText);display:flex;align-items:center;justify-content:center;flex:none}
.utility{border:0;background:var(--surfaceAlt);width:40px;height:40px;position:relative;border-radius:50%;color:var(--textSecondary);display:flex;align-items:center;justify-content:center}
.unread{position:absolute;top:-3px;right:-3px;background:var(--dangerStrong);color:var(--onDanger);font-size:10px;line-height:18px;min-width:18px;text-align:center;border-radius:9px}
.location-header{display:flex;align-items:center;gap:9px;min-height:52px}.location-header strong{display:block;font-size:13px;line-height:1.6}.chevron{font-size:16px;margin-left:4px}
.search-input{min-height:49px;display:flex;align-items:center;gap:9px;padding:12px;border:1px solid var(--outline);border-radius:11px;background:var(--surface);color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px;display:flex;flex-direction:column;gap:12px}
.active-booking{gap:12px}.active-booking h3{font-size:16px}.active-booking>.row:last-child p{font-size:11px}.active-booking>.row:last-child>.icon{width:16px;height:16px;color:var(--muted)}
.progress{height:4px;background:var(--surfaceAlt);border-radius:3px;overflow:hidden}.progress span{display:block;width:24%;height:100%;background:var(--primary)}
.badge{padding:4px 7px;border-radius:6px;font-size:9.5px;line-height:1.5;display:inline-flex;align-items:center;gap:4px;align-self:flex-start;white-space:nowrap;font-weight:600}
.badge .icon{width:11px;height:11px}.badge.info{background:var(--infoSoft);color:var(--infoText)}.badge.success{background:var(--successSoft);color:var(--successText)}
.badge.warning,.notice.warning{background:var(--warningSoft);color:var(--warningText)}.badge.danger{background:var(--dangerSoft);color:var(--dangerText)}
.badge.neutral{background:var(--surfaceAlt);color:var(--textSecondary)}.badge.brand{background:var(--primarySoft);color:var(--primaryText)}
.pillars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.pillar{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:15px;padding:14px 12px;min-height:128px;display:flex;flex-direction:column;gap:7px;align-items:flex-start;text-align:left}
.pillar strong{font-size:13px;line-height:1.35}.pillar small{font-size:10.5px}.category-icon{width:34px;height:34px;background:var(--category-soft);color:var(--category-text);display:flex;align-items:center;justify-content:center;border-radius:11px}
.section{display:flex;flex-direction:column;gap:12px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.section-heading h3{font-size:16px}.link{font-size:11px;font-weight:bold;color:var(--primaryText)}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:7px 10px;border:1px solid var(--outline);border-radius:18px;background:var(--surface);color:var(--textSecondary);font-size:10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;line-height:1.45}
.chip .icon{width:12px;height:12px}.chip.selected,.choice.selected{border-color:var(--primary);background:var(--primarySoft);color:var(--primaryText)}
.ai-entry{background:var(--primarySoft);color:var(--primaryText);padding:14px 12px;border-radius:13px}.ai-entry h3{font-size:13px;color:var(--primaryText)}.ai-entry p{font-size:10px;color:var(--primaryText)}
.ai-entry>.icon:first-child{width:28px;height:28px}.ai-entry>.icon:last-child{width:15px;height:15px}.trust-row{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:9px;justify-content:center}
